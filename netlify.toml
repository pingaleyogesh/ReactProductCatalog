[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# API routes are handled by Netlify Functions
# /api/products → netlify/functions/products.js
# /api/orders → netlify/functions/orders.js

# SPA fallback: route all non-API requests to index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
