[build]
  command = "npm run build"
  publish = "build"

# SPA fallback: route all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Example API proxy (uncomment and set your backend URL if needed):
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.com/:splat"
#   status = 200
#   force = true
